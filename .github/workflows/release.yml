name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build portable app image
        run: |
          chmod +x gradlew
          # gradle.properties hardcodes a local Windows JDK path; override it
          # with the JDK setup-java just installed.
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" jpackageImage

      - name: Package archive
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          case "${{ runner.os }}" in
            Windows) 7z a "WC3ModelExplorer-${tag}-windows.zip" ./build/jpackage/* ;;
            macOS)   tar -C build/jpackage -czf "WC3ModelExplorer-${tag}-macos.tar.gz" . ;;
            Linux)   tar -C build/jpackage -czf "WC3ModelExplorer-${tag}-linux.tar.gz" . ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WC3ModelExplorer-${{ runner.os }}
          path: |
            WC3ModelExplorer-*.zip
            WC3ModelExplorer-*.tar.gz

      - name: Extract changelog notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section for this version out of CHANGELOG.md (between its
          # "## [x.y.z]" heading and the next "## [" heading).
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { grab=1; next }
            grab && index($0, "## [") == 1 { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the full list of changes." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            WC3ModelExplorer-*.zip
            WC3ModelExplorer-*.tar.gz
